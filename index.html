<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Dash: Cube Rush</title>
    <!-- Подключение VK Bridge SDK -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
        }
        body {
            background-color: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background: linear-gradient(to bottom, #111827, #0b0f19);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>

    <script>
        // Инициализация VK Bridge с защитой для локального тестирования
        if (typeof vkBridge !== 'undefined') {
            vkBridge.send('VKWebAppInit')
                .then(() => console.log('VK Bridge initialized'))
                .catch(err => console.log('VK Bridge init error:', err));
        }

        // Функция показа межстраничной рекламы при проигрыше
        function showInterstitialAd() {
            if (typeof vkBridge !== 'undefined') {
                vkBridge.send('VKWebAppShowNativeAds', { ad_type: 'interstitial' })
                    .then(data => console.log('Реклама показана:', data.result))
                    .catch(error => console.log('Реклама пропущена или ошибка (локальный режим):', error));
            } else {
                console.log('VK Bridge не найден (локальный запуск)');
            }
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let highScore = localStorage.getItem('neonDashHighScore') || 0;

        const player = {
            x: 100,
            y: 300,
            width: 40,
            height: 40,
            vy: 0,
            gravity: 0.8,
            jumpPower: -13,
            isJumping: false
        };

        let obstacles = [];
        let obstacleTimer = 0;
        let gameSpeed = 5;

        function handleInput() {
            if (gameState === 'PLAYING') {
                if (!player.isJumping) {
                    player.vy = player.jumpPower;
                    player.isJumping = true;
                }
            } else {
                resetGame();
                gameState = 'PLAYING';
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                handleInput();
            }
        });

        canvas.addEventListener('click', handleInput);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleInput();
        });

        function resetGame() {
            player.y = 300;
            player.vy = 0;
            player.isJumping = false;
            obstacles = [];
            score = 0;
            gameSpeed = 5;
            obstacleTimer = 0;
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            player.vy += player.gravity;
            player.y += player.vy;

            if (player.y > 300) {
                player.y = 300;
                player.vy = 0;
                player.isJumping = false;


}

            obstacleTimer++;
            if (obstacleTimer > 90) {
                obstacles.push({
                    x: canvas.width,
                    y: 310,
                    width: 30,
                    height: 30
                });
                obstacleTimer = 0;
                gameSpeed += 0.05;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= gameSpeed;

                if (
                    player.x < obstacles[i].x + obstacles[i].width &&
                    player.x + player.width > obstacles[i].x &&
                    player.y < obstacles[i].y + obstacles[i].height &&
                    player.y + player.height > obstacles[i].y
                ) {
                    gameState = 'GAMEOVER';
                    if (score > highScore) {
                        highScore = Math.floor(score);
                        localStorage.setItem('neonDashHighScore', highScore);
                    }
                    showInterstitialAd();
                }

                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                    score += 10;
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Пол
            ctx.strokeStyle = '#00f3ff';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00f3ff';
            ctx.beginPath();
            ctx.moveTo(0, 340);
            ctx.lineTo(canvas.width, 340);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Игрок
            ctx.fillStyle = '#ff0055';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff0055';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.shadowBlur = 0;

            // Препятствия
            ctx.fillStyle = '#00f3ff';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00f3ff';
            for (let obs of obstacles) {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            }
            ctx.shadowBlur = 0;

            // Счёт
            ctx.fillStyle = '#ffffff';
            ctx.font = '20px Segoe UI';
            ctx.fillText(`Счет: ${Math.floor(score)}`, 20, 35);
            ctx.fillText(`Рекорд: ${highScore}`, canvas.width - 160, 35);

            if (gameState === 'START') {
                ctx.fillStyle = 'rgba(11, 15, 25, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#00f3ff';
                ctx.font = 'bold 36px Segoe UI';
                ctx.textAlign = 'center';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#00f3ff';
                ctx.fillText('NEON DASH: CUBE RUSH', canvas.width / 2, canvas.height / 2 - 30);
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#ffffff';
                ctx.font = '20px Segoe UI';
                ctx.fillText('Нажмите пробел или тапните, чтобы начать', canvas.width / 2, canvas.height / 2 + 20);
                ctx.textAlign = 'left';
            } else if (gameState === 'GAMEOVER') {
                ctx.fillStyle = 'rgba(11, 15, 25, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ff0055';
                ctx.font = 'bold 36px Segoe UI';
                ctx.textAlign = 'center';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ff0055';
                ctx.fillText('ИГРА ОКОНЧЕНА', canvas.width / 2, canvas.height / 2 - 40);
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#ffffff';
                ctx.font = '22px Segoe UI';
                ctx.fillText(`Ваш счет: ${Math.floor(score)}`, canvas.width / 2, canvas.height / 2 + 10);
                ctx.font = '18px Segoe UI';
                ctx.fillStyle = '#00f3ff';


ctx.fillText('Нажмите, чтобы сыграть снова', canvas.width / 2, canvas.height / 2 + 50);
                ctx.textAlign = 'left';
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
